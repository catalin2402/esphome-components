esphome:
  name: all-components-idf
  on_boot:
    then:
      - cd405x.activate_channel:
          id: mux
          channel: 2
      - cd405x.inhibit:
          id: mux
          inhibit: false
      - pt2258.resend_data: volume_controller
      - pt2258.mute: volume_controller
      - pt2258.unmute: volume_controller
      - pt2323.set_input:
          id: audio_selector
          input: 1
      - pt2323.set_enhance:
          id: audio_selector
          enhance: false
      - pt2323.set_boost:
          id: audio_selector
          boost: false
      - pt2323.mute_channel:
          id: audio_selector
          channel: 1
      - pt2323.unmute_channel:
          id: audio_selector
          channel: 1
      - pt2323.resend_data: audio_selector
      - tea5767.set_frequency:
          id: radio
          frequency: 99.5MHz
      - tea5767.set_mute:
          id: radio
          mute: false
      - tea5767.set_mono:
          id: radio
          mono: false
      - tea5767.set_soft_mute:
          id: radio
          soft_mute: false
      - tea5767.set_stereo_noise_canceling:
          id: radio
          stereo_noise_canceling: true
      - tea5767.set_high_cut_control:
          id: radio
          high_cut_control: true

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components
    components:
      - arduino_expander
      - auriol_4ld5661
      - cd405x
      - climate_ir_hyundai
      - lcd_base
      - pt2258
      - pt2323
      - remote_receiver
      - rf_remote
      - tea5767
      - xiron_decoder

i2c:
  sda: GPIO21
  scl: GPIO22

remote_receiver:
  id: rf_receiver
  pin: GPIO4

remote_transmitter:
  id: ir_transmitter
  pin: GPIO17
  carrier_duty_percent: 50%
  non_blocking: true

arduino_expander:
  id: expander
  adc_source: internal

cd405x:
  id: mux
  pin_a: GPIO18
  pin_b: GPIO19
  pin_c: GPIO23
  pin_inhibit: GPIO25

pt2258:
  id: volume_controller
  default_volume: 20

pt2323:
  id: audio_selector
  input: 1
  enhance: false
  boost: false

tea5767:
  id: radio
  frequency: 99.5MHz
  mono_sensor:
    name: Radio Mono
  level_sensor:
    name: Radio Level
  frequency_sensor:
    name: Radio Frequency

sensor:
  - platform: arduino_expander
    arduino_expander: expander
    pin: 0
    name: Expander Analog
  - platform: auriol_4ld5661
    receiver_id: rf_receiver
    auriol_id: 0x3A
    temperature:
      name: Auriol Temperature
  - platform: xiron_decoder
    receiver_id: rf_receiver
    xiron_id: 0x1234
    temperature:
      name: Xiron Temperature
    humidity:
      name: Xiron Humidity
    battery:
      name: Xiron Battery Low
  - platform: rf_remote
    receiver_id: rf_receiver
    remote_id: 0x18B91
    name: RF Value
binary_sensor:
  - platform: rf_remote
    receiver_id: rf_receiver
    remote_id: 0x18B91
    remote_button: 3
    name: RF Button

number:
  - platform: pt2258
    pt2258_id: volume_controller
    type: master
    name: Master Volume
  - platform: pt2258
    pt2258_id: volume_controller
    type: volume
    channel_a: 1
    name: Channel Volume
select:
  - platform: pt2323
    pt2323_id: audio_selector
    options:
      - Input 1
      - Input 2
    name: Audio Input
switch:
  - platform: pt2323
    pt2323_id: audio_selector
    type: mute
    channel_a: 1
    name: Channel Mute
  - platform: tea5767
    tea5767_id: radio
    type: mute
    name: Radio Mute
climate:
  - platform: climate_ir_hyundai
    name: Hyundai Climate
    transmitter_id: ir_transmitter
    receiver_id: rf_receiver
display:
  - platform: lcd_gpio
    dimensions: 16x2
    data_pins:
      - GPIO26
      - GPIO27
      - GPIO32
      - GPIO33
    enable_pin: GPIO14
    rs_pin: GPIO13
    lambda: |-
      it.print("Component test");
