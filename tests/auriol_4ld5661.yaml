esphome:
  name: auriol-4ld5661-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: "test-network"
  password: "test-password"

api:

external_components:
  - source:
      type: local
      path: ../components
    components:
      - auriol_4ld5661
      - rf_remote

remote_receiver:
  id: rf_receiver
  pin: GPIO4
  tolerance: 50%
  filter: 250us
  idle: 4ms

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - platform: auriol_4ld5661
    receiver_id: rf_receiver
    auriol_id: "3A"
    time_id: homeassistant_time
    mm_per_tip: 0.3
    rain_timeout: 1h

    temperature:
      name: "Outdoor temperature"
    rain:
      name: "Rain counter"
    rain_tips:
      name: "Rain counter in tips"
    total_last_rain:
      name: "Current or last rain event"
    total_rain_last_12h:
      name: "Rain in last 12 hours"
    total_rain_last_24h:
      name: "Rain in last 24 hours"
    battery:
      name: "Weather sensor battery low"
    start_of_rain:
      name: "Start of rain"
    end_of_rain:
      name: "End of rain"

  - platform: rf_remote
    name: "RF remote command"
    receiver_id: rf_receiver
    remote_id: "098B9"

binary_sensor:
  - platform: rf_remote
    name: "RF remote button"
    receiver_id: rf_receiver
    remote_id: "098B9"
    remote_button: 1
