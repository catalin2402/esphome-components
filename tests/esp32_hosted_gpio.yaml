esphome:
  name: esp32-hosted-gpio-test

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  framework:
    type: esp-idf

logger:

wifi:
  ssid: test
  password: test-password

external_components:
  - source:
      type: local
      path: ../components
    components:
      - esp32_hosted_gpio

esp32_hosted:
  type: sdio
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO4
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO14
  bus_width: 1

esp32_hosted_gpio:
  id: hosted_gpio

switch:
  - platform: gpio
    name: Hosted Output
    pin:
      esp32_hosted_gpio: hosted_gpio
      number: 5
      mode:
        output: true

binary_sensor:
  - platform: gpio
    name: Hosted Input
    pin:
      esp32_hosted_gpio: hosted_gpio
      number: 6
      mode:
        input: true
